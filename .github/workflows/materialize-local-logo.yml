name: Materialize local ResolvX logo asset

on:
  push:
    branches:
      - fix/favicon-local-ai-provider-logos

permissions:
  contents: write

jobs:
  copy-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/favicon-local-ai-provider-logos
      - name: Optimize the exact supplied PNG for web use
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/resolvx-logo.png
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('assets/resolvx-logo.png')
          with Image.open(path) as original:
              original.verify()
          with Image.open(path) as image:
              image.thumbnail((512, 512), Image.Resampling.LANCZOS)
              if image.mode not in ('RGB', 'RGBA'):
                  image = image.convert('RGBA')
              image.save(path, format='PNG', optimize=True)
          data = path.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n') or len(data) < 100:
              raise SystemExit('Optimized local logo failed PNG validation.')
          import base64
          encoded = base64.b64encode(data).decode('ascii')
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <title>ResolvX</title>
            <rect width="128" height="128" rx="20" fill="#080a12"/>
            <defs><clipPath id="icon-clip"><rect width="128" height="128" rx="20"/></clipPath></defs>
            <image href="data:image/png;base64,{encoded}" x="-12" y="-12" width="152" height="152"
              preserveAspectRatio="xMidYMid slice" clip-path="url(#icon-clip)"/>
          </svg>
          '''
          Path('favicon-local.svg').write_text(svg, encoding='utf-8')
          print(f'Optimized local logo to {len(data)} bytes and created a self-contained favicon.')
          PY
      - name: Commit optimized local logo and self-contained favicon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/resolvx-logo.png favicon-local.svg
          git commit -m 'chore: materialize local ResolvX logo asset'
          git push origin HEAD:fix/favicon-local-ai-provider-logos
