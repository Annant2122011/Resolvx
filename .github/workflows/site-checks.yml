name: QueryFixr Site Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check site.js && node --check api/translate.js && node --check netlify/functions/translate.js && node --check scripts/validate-site.mjs && node --check scripts/test-search.mjs && node --check scripts/test-translation-proxy.cjs
      - name: Check links, anchors, IDs, branding, and CSS structure
        run: node scripts/validate-site.mjs && node scripts/test-search.mjs && node scripts/test-translation-proxy.cjs
